name: Deploy Staging

on:
  push:
    branches:
      - dev

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  quality-gate:
    uses: ./.github/workflows/frontend-quality-gate.yml
    with:
      artifact_prefix: staging

  build:
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          BUILD_VERSION=$(node -p "require('./package.json').version")
          BUILD_COMMIT="${{ github.sha }}" \
            BUILD_VERSION="$BUILD_VERSION" \
            SENTRY_ENVIRONMENT=staging \
            NODE_ENV=production \
            npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.run_id }}
          path: dist/
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: [quality-gate, build]

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.run_id }}
          path: dist

      - name: Copy dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_DEPLOY_HOST }}
          username: ${{ secrets.STAGING_DEPLOY_USER }}
          key: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          source: "dist/"
          target: "${{ secrets.STAGING_DEPLOY_PATH }}"
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_DEPLOY_HOST }}
          username: ${{ secrets.STAGING_DEPLOY_USER }}
          key: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            git fetch --all
            git switch -f -C dev origin/dev
            npm ci
            BUILD_VERSION=$(node -p "require('./package.json').version")
            printf 'BUILD_COMMIT=%s\nBUILD_VERSION=%s\n' "${{ github.sha }}" "$BUILD_VERSION" > .env.build
            sleep 2
            bash scripts/smoke.sh

  notify-telegram:
    runs-on: ubuntu-latest
    needs:
      - quality-gate
      - build
      - deploy
    if: always()

    steps:
      - name: Send staging deploy notification to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          QUALITY_RESULT: ${{ needs.quality-gate.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets not configured. Skipping."
            exit 0
          fi

          if [ "$QUALITY_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ]; then
            STATUS_ICON="✅"
          else
            STATUS_ICON="🚨"
          fi

          MESSAGE="${STATUS_ICON} ARIS staging push%0AQuality gate: ${QUALITY_RESULT}%0ADeploy: ${DEPLOY_RESULT}%0ARepository: ${REPOSITORY}%0ABranch: ${BRANCH}%0AActor: ${ACTOR}%0ACommit: ${COMMIT_SHA}%0ARun: ${RUN_URL}"

          curl --fail --silent --show-error \
            --request POST \
            --url "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data chat_id="${TELEGRAM_CHAT_ID}" \
            --data text="${MESSAGE}"
